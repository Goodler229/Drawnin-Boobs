const L=[],deg={};S.items.forEach(i=>{if(i.type=='note')links(i.body).forEach(t=>{const f=find(t);if(f&&f.id!=i.id){L.push([B[i.id],B[f.id]]);deg[i.id]=(deg[i.id]||0)+1;deg[f.id]=(deg[f.id]||0)+1}})});
const rad=n=>7+Math.min(10,(deg[n.id]||0)*2.5),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();let drag=null,moved=0,hov=null,rb=null,gm=null,gp=[0,0];

function frame(){for(const a of N){for(const b of N){if(a==b)continue;const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;if(d2<90000){const d=Math.sqrt(d2),f=6000/d2;a.vx+=dx/d*f;a.vy+=dy/d*f}}a.vx+=(W/2-a.x)*.002;a.vy+=(H/2-a.y)*.002}
for(const[a,b]of L){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-120)*.01;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
for(const n of N){if(n.fx)continue;n.vx*=.85;n.vy*=.85;n.x+=n.vx;n.y+=n.vy}
x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);x.strokeStyle=css('--mut');x.globalAlpha=.45;x.lineWidth=1.5;L.forEach(([a,b])=>{x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()});x.globalAlpha=1;
for(const n of N){const r=rad(n);x.fillStyle=css(n.d?'--dg':'--nd');x.beginPath();n.d?x.rect(n.x-r,n.y-r,2*r,2*r):x.arc(n.x,n.y,r,0,7);x.fill();if(n.id==S.cur||n==hov){x.lineWidth=3;x.strokeStyle=css('--tx');x.stroke()}
if(gs.has(n.id)){x.lineWidth=3;x.strokeStyle=css('--ac');x.beginPath();x.arc(n.x,n.y,r+5,0,7);x.stroke()}
x.fillStyle=css('--tx');x.font='12px system-ui,sans-serif';x.textAlign='center';x.fillText(n.t,n.x,n.y+r+15)}
if(rb){x.save();const X=Math.min(rb.x0,rb.x1),Y=Math.min(rb.y0,rb.y1),w=Math.abs(rb.x1-rb.x0),h=Math.abs(rb.y1-rb.y0);x.fillStyle=css('--ac');x.globalAlpha=.1;x.fillRect(X,Y,w,h);x.globalAlpha=1;x.strokeStyle=css('--ac');x.lineWidth=1;x.setLineDash([4,3]);x.strokeRect(X,Y,w,h);x.restore()}
raf=requestAnimationFrame(frame)}
const P=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const stop=()=>{if(gm)gm.forEach(g=>g[0].fx=0);drag=null;gm=null;rb=null};
c.onpointerdown=e=>{const[px,py]=P(e),n=hit(px,py),add=e.ctrlKey||e.metaKey||e.shiftKey;moved=0;gp=[px,py];
if(n){if(add){gs.has(n.id)?gs.delete(n.id):gs.add(n.id);upd();return}
if(!gs.has(n.id)){gs=new Set();upd()}drag=n;gm=N.filter(m=>gs.has(m.id)||m==n).map(m=>[m,m.x,m.y]);gm.forEach(g=>g[0].fx=1)}
else{drag=null;const base=add?new Set(gs):new Set();gs=new Set(base);rb={x0:px,y0:py,x1:px,y1:py,base};upd()}};
c.onpointermove=e=>{const[px,py]=P(e);
if(drag){const dx=px-gp[0],dy=py-gp[1];gm.forEach(([m,ox,oy])=>{m.x=ox+dx;m.y=oy+dy;m.vx=m.vy=0});moved++}
else if(rb){rb.x1=px;rb.y1=py;const a=Math.min(rb.x0,px),b=Math.max(rb.x0,px),cc=Math.min(rb.y0,py),d=Math.max(rb.y0,py);gs=new Set(rb.base);N.forEach(m=>{if(m.x>=a&&m.x<=b&&m.y>=cc&&m.y<=d)gs.add(m.id)});upd()}
else{hov=hit(px,py)||null;c.style.cursor=hov?'pointer':'default'}};
