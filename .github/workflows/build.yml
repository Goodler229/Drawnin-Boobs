directories:
  output: dist
  buildResources: build
appId: com.example.neuromap
productName: Neuromap
files:
  - filter:
      - main.js
      - index.html
      - config.json
      - package.json
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 33.4.11
